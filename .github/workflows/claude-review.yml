                   reads: $read_diagnostics,
                   reads_truncated: (($reads | length) > 16),
                   gap_range_count: ($gap_ranges | length),
                   gap_ranges: $gap_ranges[0:16],
                   gap_ranges_truncated: (($gap_ranges | length) > 16)};
