                | select(.type == "tool_use")
                | select(.name as $name | $allowed | index($name) | not))
              | .name as $name
              | {tool: (if ($name | type) != "string" then "malformed"
                        elif $name == "Agent" then "Agent"
                        elif $name == "EndConversation" then "EndConversation"
                        elif $name == "ScheduleWakeup" then "ScheduleWakeup"
                        elif $name == "Bash" then "Bash"
                        else "other" end)}
