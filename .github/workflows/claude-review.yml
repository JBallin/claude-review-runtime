              | (reduce (.[] | select(.type == "user") | blocks[] | select(.type == "tool_result")) as $response
                  ({}; .[$response.tool_use_id] += [$response])) as $responses
              | {metadata: stats($uses; $responses; $metadata; $metadata_content),
                 diff: stats($uses; $responses; $diff; $diff_content)}
              ' "$EXECUTION_FILE" 2> /dev/null); then
              printf 'Claude review captured-input coverage: %s\n' "$diagnostics" || :
            fi
          fi

          if [ -n "${REVIEW_HELPER:-}" ]; then
