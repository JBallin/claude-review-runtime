                # forward instead of rescanning/reparsing all earlier reads.
                | (reduce $reads[0:16][] as $read ({prior: {}, summaries: []};
                    [$read.parsed[] | .number | select(. >= 1 and . <= $expected_count)] as $numbers
                    | (ranges($numbers)) as $returned_ranges
                    | .prior as $prior
                    | .summaries += [{
                        request_offset: request_integer($read.input.offset?),
                        request_limit: request_integer($read.input.limit?),
                        response_count: ($read.responses | length),
                        successful: (($read.successful | length) > 0),
                        parsed_line_count: ($numbers | length),
                        overlap_line_count: ([$numbers | unique | .[]
                          | select($prior[(tostring)] == true)] | length),
                        returned_range_count: ($returned_ranges | length),
                        returned_ranges: $returned_ranges[0:16],
                        returned_ranges_truncated: (($returned_ranges | length) > 16)}]
                    | reduce $numbers[] as $number (.; .prior[($number | tostring)] = true))
                    | .summaries) as $read_diagnostics
                | {read_count: ($matching | length),
                   successful_read_count: ([$reads[] | .successful | length] | add // 0),
                   expected_line_count: $expected_count, matched_line_count: ($matched | length),
                   missing_line_count: ($missing_numbers | length),
                   unparsed_line_count: ([$reads[] | (.returned | length) - (.parsed | length)] | add // 0),
                   content_shapes: ([$reads[] | .responses[] | .content | shape] | unique),
