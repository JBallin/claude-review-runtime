  publish-status:
    name: Publish status
    needs: [start-check, review]
    # Runs after any review attempt start-check actually began, including a
    # failed one, but never for an event start-check's gate skipped.
    if: always() && needs.start-check.result != 'skipped'
    runs-on: ubuntu-latest
    # Sized for the bundled review helper's bounded retries.
    timeout-minutes: 18
    # PR comments need pull-requests: write; top-level PR reactions use the issue endpoint and need issues: write.
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
