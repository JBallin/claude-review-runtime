                | (reduce ($reads[] | .parsed[]) as $line
                    ({}; if $line.number >= 1 and $line.number <= $expected_count
                      and $line.text == $expected[$line.number - 1]
                      then .[($line.number | tostring)] = true else . end)) as $matched
                | ([range(1; $expected_count + 1) as $number
                    | select($matched[($number | tostring)] != true) | $number]) as $missing_numbers
                | (ranges($missing_numbers)) as $gap_ranges
