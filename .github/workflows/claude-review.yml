          # five-second subprocess deadline bounds generation. Emit only fixed
          # labels/enums, bounded integers/ranges and flags; never raw content.
          if [ "${reason:-}" = unexpected_tool ]; then
            if diagnostics=$(python3 -c '
          import subprocess
          import sys

          try:
              result = subprocess.run(sys.argv[1:], stdout=subprocess.PIPE,
                                      stderr=subprocess.DEVNULL, timeout=5, check=True)
              sys.stdout.buffer.write(result.stdout)
          except (OSError, subprocess.SubprocessError):
              sys.exit(1)
