name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  validation:
    name: Validation
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Report runner image and tools
        run: |
          printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          cat /etc/os-release
          uname -m
          for tool in python3 bash git gh jq curl timeout; do
            printf '\n%s: ' "$tool"
            command -v "$tool"
            if ! "$tool" --version; then
              "$tool" --help
            fi
          done
      - name: Check out candidate
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Check generated review gallery
        run: python3 -B scripts/render_presentation_gallery.py --check
      - name: Run regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v
