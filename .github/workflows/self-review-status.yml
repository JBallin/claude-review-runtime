name: Claude self-review status

on:
  pull_request:
    types: [synchronize, edited]

permissions: {}

jobs:
  status:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: JBallin/claude-review-runtime/.github/workflows/claude-review-status.yml@b9a56eae9db8d11b67f5b6c5682c349146124711
