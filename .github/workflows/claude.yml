name: Claude

# Review a PR requested by a trusted commenter on the caller's selected events.
# The trusted start job resolves head/base once and captures the request and
# compare diff. Checkout, model inputs, and inline-comment targets use that
# capture even if the PR advances. Claude has only read tools and the narrow
# inline-finding tool; it cannot invoke Bash, edit files, or run subagents.
# The pinned runtime supplies the publication helper through $/. Separate
# trusted jobs publish the exact-head Check and informational status/reactions.
# A clean result requires both complete finding evidence and verified model
# completion; an action-level workflow-validation skip is not a clean review.
#
# A top-level issue_comment is the supported manual fork path. A fork review
# comment may lack secrets/OIDC. Fork Check publication is best-effort; inline
# findings alone do not establish a trustworthy clean completion. Cross-repo
# and public-fork behavior still require live validation for this prototype.
# Live CI access is excluded because it need not describe the captured patch.
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read
  id-token: write

# Eligible reviews for a PR share one queue with claude-review.yml's, so two
# reviews never overlap on the same PR's comment evidence; queue: max keeps
# every pending /claude-review request instead of replacing all but the newest.
# Ineligible comments get a per-run group so they can never occupy that queue.
# The predicate must stay textually identical to start-check's `if:`
# (enforced by tests).
concurrency:
  group: >-
    ${{
    ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
    github.event.comment.body == '/claude-review' &&
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
    github.event.comment.author_association) &&
    (github.event_name == 'pull_request_review_comment' ||
    github.event.issue.pull_request))
    && format('claude-review-state-{0}-{1}', github.repository, github.event.pull_request.number || github.event.issue.number)
    || format('claude-review-ineligible-{0}', github.run_id)
    }}
  cancel-in-progress: false
  queue: max

jobs:
  start-check:
    name: Start check
    # Only trusted commenters start a run, so anyone else's /claude-review never
    # occupies a runner (the action also requires write access). This keeps the
    # workflow limited to trusted requests. Gating this first job
    # keeps ineligible comments away from every later job and from
    # checks: write.
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      github.event.comment.body == '/claude-review' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.comment.author_association) &&
      (github.event_name == 'pull_request_review_comment' ||
      github.event.issue.pull_request)
    runs-on: ubuntu-latest
    # Sized for the bundled review helper's bounded retries.
    timeout-minutes: 14
    # PR comments need pull-requests: write; top-level PR reactions use the issue endpoint and need issues: write.
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      is_fork: ${{ steps.resolve.outputs.is_fork }}
      merge_base_sha: ${{ steps.capture.outputs.merge_base_sha }}
      check_run_id: ${{ steps.check.outputs.check_run_id }}
      status_comment_id: ${{ steps.check.outputs.status_comment_id }}
      presentation_owner: ${{ steps.check.outputs.presentation_owner }}
    # The check run is created as soon as the reviewed head SHA is resolved,
    # before the remaining fallible input capture, so a later failure is
    # published as that check's failure. A failure before the head SHA is
    # known cannot be attached to any commit and only fails the job.
    steps:
      - name: Resolve PR under review
        # Uses the trusted job's token directly; this step's
        # environment is never passed to or reachable by Claude. Runs
        # before checkout, so there's no local repository yet for gh to
        # infer a target from -- --repo makes that explicit rather than
        # relying on working-tree discovery that doesn't exist at this
        # point. Resolves the PR's base/head SHAs exactly once so
        # everything downstream (checkout, diff, review metadata, and the
        # eventual inline-comment commit target) describes the same
        # immutable snapshot even if the PR advances later in the run.
        # PR-supplied text (title, body) stays inside gh pr view's own JSON
        # output until the capture step below uses it.
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_REPOSITORY: ${{ job.workflow_repository }}
          RUNTIME_SHA: ${{ job.workflow_sha }}
          RUNTIME_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr-review"

          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json number,title,body,baseRefName,baseRefOid,headRefOid,isCrossRepository \
            > "$RUNNER_TEMP/pr-review/pr-raw.json"

          HEAD_SHA=$(jq -r '.headRefOid' "$RUNNER_TEMP/pr-review/pr-raw.json")
          BASE_SHA=$(jq -r '.baseRefOid' "$RUNNER_TEMP/pr-review/pr-raw.json")
          BASE_REF=$(jq -r '.baseRefName' "$RUNNER_TEMP/pr-review/pr-raw.json")
          IS_FORK=$(jq -r '.isCrossRepository' "$RUNNER_TEMP/pr-review/pr-raw.json")

          {
            echo "head_sha=$HEAD_SHA"
            echo "base_sha=$BASE_SHA"
            echo "base_ref=$BASE_REF"
            echo "is_fork=$IS_FORK"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"
      - name: Capture presentation start
        id: presentation-start
        continue-on-error: true
        # Captured once under the shared PR queue. Partial-job reruns retain
        # this token; only a newly executed start can acquire a new owner.
        run: |
          python3 -c 'import os,time; open(os.environ["GITHUB_OUTPUT"], "a").write("token=" + str(time.time_ns()) + "\n")'
      - name: Check review tooling
        id: tooling-ready
        if: steps.resolve.outputs.base_sha != ''
        continue-on-error: ${{ steps.resolve.outputs.is_fork == 'true' }}
        uses: $/actions/review-helper
        with:
          command: create
      - name: Start Claude Review check
        # Required for a same-repository PR; best-effort for a fork PR, whose
        # review must not depend on check publication. Every step here that
        # only serves check publication or its evidence is likewise non-fatal
        # for a fork; resolving the PR and capturing the review snapshot stay
        # required for every PR.
        id: check
        if: steps.tooling-ready.outcome == 'success'
        continue-on-error: ${{ steps.resolve.outputs.is_fork == 'true' }}
        env:
          REVIEW_HELPER: ${{ steps.tooling-ready.outputs.helper-path }}
          GH_TOKEN: ${{ github.token }}
          RUNTIME_REPOSITORY: ${{ job.workflow_repository }}
          RUNTIME_SHA: ${{ job.workflow_sha }}
          RUNTIME_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          BASE_REF: ${{ steps.resolve.outputs.base_ref }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          STATUS_COMMENTS_ENABLED: "true"
          IS_FORK: ${{ steps.resolve.outputs.is_fork }}
          PRESENTATION_START: ${{ steps.presentation-start.outputs.token }}
          TRIGGER_KIND: ${{ github.event_name }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          PR_REACTION_MODE: manual
          TRIGGER_LABEL: Manual request
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXTERNAL_ID: ${{ github.workflow }}/${{ github.run_id }}/${{ github.run_attempt }}
        run: python3 "$REVIEW_HELPER" create
      - name: Capture PR review snapshot
        # Builds the review inputs from the resolution above only. Diff comes
        # from GitHub's compare API between the captured SHAs, not a live gh
        # pr diff by number, which would resolve against whatever the PR's
        # head is when it runs. PR-supplied text (title, body, the triggering
        # comment) either stays inside gh pr view's own JSON output or goes
        # through jq --arg -- never interpolated directly into this script.
        # The review job receives these files as an artifact and never looks
        # the PR up again. The merge base identifies the reviewed diff for
        # later sticky-finding checks.
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_REPOSITORY: ${{ job.workflow_repository }}
          RUNTIME_SHA: ${{ job.workflow_sha }}
          RUNTIME_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          BASE_REF: ${{ steps.resolve.outputs.base_ref }}
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
        run: |
          gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" \
            -H "Accept: application/vnd.github.v3.diff" \
            > "$RUNNER_TEMP/pr-review/diff.patch"
          MERGE_BASE_SHA=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA?per_page=1" \
            --jq '.merge_base_commit.sha')

          jq --arg comment "$TRIGGER_COMMENT" \
             --arg base_ref "$BASE_REF" \
             --arg base_sha "$BASE_SHA" \
             --arg runtime_repository "$RUNTIME_REPOSITORY" \
             --arg runtime_sha "$RUNTIME_SHA" \
             --arg runtime_workflow_path "$RUNTIME_WORKFLOW_PATH" \
             --arg head_sha "$HEAD_SHA" \
             '{number, title, body, base_ref: $base_ref, base_sha: $base_sha, head_sha: $head_sha, trigger_comment: $comment, runtime_repository: $runtime_repository, runtime_sha: $runtime_sha, runtime_workflow_path: $runtime_workflow_path}' \
             "$RUNNER_TEMP/pr-review/pr-raw.json" > "$RUNNER_TEMP/pr-review/request.json"
          rm "$RUNNER_TEMP/pr-review/pr-raw.json"

          echo "merge_base_sha=$MERGE_BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Record existing Claude review comments
        continue-on-error: ${{ steps.resolve.outputs.is_fork == 'true' }}
        env:
          REVIEW_HELPER: ${{ steps.tooling-ready.outputs.helper-path }}
          GH_TOKEN: ${{ github.token }}
          RUNTIME_REPOSITORY: ${{ job.workflow_repository }}
          RUNTIME_SHA: ${{ job.workflow_sha }}
          RUNTIME_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: >-
          python3 "$REVIEW_HELPER" snapshot
          --output "$RUNNER_TEMP/claude-review-evidence/before-comment-ids.json"
      - name: Upload review snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-review-snapshot
          path: ${{ runner.temp }}/pr-review/
          if-no-files-found: error
          retention-days: 1
      - name: Upload pre-review comment evidence
        continue-on-error: ${{ steps.resolve.outputs.is_fork == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: claude-review-evidence
          path: ${{ runner.temp }}/claude-review-evidence/
          if-no-files-found: error
          retention-days: 1

  review:
    name: Respond
    needs: start-check
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      conclusion: ${{ steps.review.outputs.conclusion }}
      completion_verified: ${{ steps.verify.outputs.completion_verified }}
      completion_reason: ${{ steps.verify.outputs.completion_reason }}
      finding_publication: ${{ steps.verify.outputs.finding_publication }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Pin to the captured head SHA, not a live branch or the default
          # pull_request-style ref -- agent mode does no fetch/checkout of
          # its own (unlike tag mode), so this is the only place the
          # reviewed snapshot gets fixed.
          ref: ${{ needs.start-check.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download review snapshot
        # The exact inputs start-check captured; this job never queries the
        # live PR itself.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pr-review-snapshot
          path: ${{ runner.temp }}/pr-review
      - name: Review pull request
        id: review
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104
        # Runs any subagent in the foreground, as a backstop to --tools below:
        # a background task lets the run end early on an interim result.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          classify_inline_comments: "false"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Restores .claude/, .mcp.json, etc. from the PR's actual base
          # branch rather than the repository default -- agent mode's own
          # fallback is "still secure" per the action's source but less
          # precise, since an issue_comment payload doesn't carry the PR's
          # base ref the way a pull_request payload does.
          base_branch: ${{ needs.start-check.outputs.base_ref }}
          prompt: >-
            First use Read with file_path set to each exact absolute metadata
            and diff path below. Read every line of both files before reviewing;
            if a response is partial, continue with offset and limit until all
            lines have been returned. Truncated or unread content cannot verify
            a clean review.
            Review the pull request described in
            ${{ runner.temp }}/pr-review/request.json (which includes
            head_sha, the exact commit this review covers, and
            trigger_comment, the specific manual request being acted on --
            this is the only comment captured; no other PR comments are
            fetched or visible) and the diff at
            ${{ runner.temp }}/pr-review/diff.patch, which covers
            exactly base_sha to head_sha from that same file. Read the
            repository as needed for context. Flag significant bugs and
            correctness issues introduced by the diff only; ignore
            nitpicks and pre-existing issues. For each issue found, post an
            inline comment with mcp__github_inline_comment__create_inline_comment
            citing the file and line, and always pass commit_id set to
            exactly the head_sha value from request.json -- never omit it,
            since omitting it targets whatever the PR's head happens to be
            when the comment posts rather than the commit actually
            reviewed. If nothing warrants a comment, do not post anything.
          # claude-code-action embeds its own write-scoped GitHub token into
          # .git/config before Claude runs, and copies the whole process
          # environment (including that token and the job's own default
          # token) into the session Bash tools inherit. No single control
          # here makes those credentials unobservable by itself: denying
          # Bash entirely removes the model-controlled shell path to them,
          # the .git deny and read fence below remove the file-read path,
          # --strict-mcp-config keeps any other MCP configuration (e.g. a
          # reviewed PR's own .mcp.json, which the action's trusted-config
          # restore already replaces from the base branch before Claude
          # starts -- this is separate, additional defense in depth, not a
          # substitute) from being loaded at all, and blanking the ambient
          # token variables covers whatever's left. The action-owned MCP
          # server this workflow actually installs -- github_inline_comment
          # is the only one requested here; agent mode doesn't install the
          # tag-mode tracking-comment server, so there's no more "Claude is
          # working..." comment -- gets its own credentials baked into its
          # spawn config before these settings are read, so none of the
          # above exposes or replaces them.
          # setting-sources user: excludes a reviewed PR's own
          # .claude/settings.json from loading, so untrusted PR content
          # can't alter Claude's own configuration.
          # blockReadsOutsideWorkingDirectories: keeps Read/Grep/Glob fenced
          # to the checked-out repo plus the explicitly added pr-review
          # directory, even though Bash (the more obvious exfiltration
          # path) is gone. The .git deny is listed both relative to the
          # working directory and as an absolute path (Claude Code's `//`
          # syntax) so it holds regardless of how a tool call addresses the
          # path; Claude Code applies Read deny rules to Grep/Glob's search
          # directory too, so no separate rule is needed for those tools.
          settings: |
            {
              "env": {
                "GITHUB_TOKEN": "",
                "GH_TOKEN": "",
                "DEFAULT_WORKFLOW_TOKEN": ""
              },
              "permissions": {
                "deny": ["Read(./.git/**)", "Read(/${{ github.workspace }}/.git/**)"],
                "blockReadsOutsideWorkingDirectories": true
              }
            }
          # --tools restricts the built-in tools to Read, Glob, and Grep
          # (--allowedTools only skips permission prompts), which removes Agent
          # and with it the known subagent path; it does not affect MCP tools.
          # A built-in the CLI cannot remove, such as EndConversation, may still
          # be offered, so the verifier below rejects any unexpected tool use.
          claude_args: >-
            --max-turns 15
            --setting-sources user
            --strict-mcp-config
            --permission-mode default
            --add-dir ${{ runner.temp }}/pr-review
            --tools "Read,Glob,Grep"
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash"
      - name: Verify review completion
        # Trusted inline check of the action's own execution record, never
        # code from the reviewed head. claude-code-action reports success from
        # the first result it sees, so this confirms the run was one
        # foreground review that finished normally: a single clean result at
        # the end, every review tool available (so findings could be posted)
        # and no Agent tool, no tool used beyond the review tools (an extra
        # non-removable built-in may be offered but not used), every tool call
        # answered, correct inline commit targets, no errored publication,
        # complete captured-input Read coverage, and no subagent/background
        # activity. Only the verdict and complete bounded publication receipts
        # leave this job; the transcript is never uploaded or published.
        id: verify
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          REVIEW_HEAD_SHA: ${{ needs.start-check.outputs.head_sha }}
          REVIEW_METADATA_FILE: ${{ runner.temp }}/pr-review/request.json
          REVIEW_DIFF_FILE: ${{ runner.temp }}/pr-review/diff.patch
          ALLOWED_TOOLS: '["Read","Glob","Grep","mcp__github_inline_comment__create_inline_comment"]'
        run: |
          verdict() {
            echo "completion_verified=$1" >> "$GITHUB_OUTPUT"
            echo "completion_reason=$2" >> "$GITHUB_OUTPUT"
            echo "Claude review completion verified: $1 ($2)"
          }
          program='
            def blocks: (.message.content? // []) | if type == "array" then . else [] end;
            def file_lines:
              if . == "" then [] else split("\n") | if .[-1] == "" then .[:-1] else . end
                | map(rtrimstr("\r")) end;
            def returned_text:
              if type == "string" then .
              elif type == "array" then map(select(.type == "text") | .text) | join("\n")
              else "" end;
            # Compare model-directed tool content, not SDK sidecar line counts
            # or the requested limit. Read may truncate lines/pages successfully:
            # https://code.claude.com/docs/en/tools-reference#read-tool-behavior
            # Arrow, tab, and colon are known Read line-number separators;
            # unknown rendering or omitted/truncated content fails closed.
            def covered($reads; $path; $captured):
              [$reads[] | select(.path == $path)] as $matching
              | ([$matching[] | .content | returned_text | split("\n")[]
                  | try capture("^[ \t]*(?<number>[0-9]+)[→\t:](?<text>.*)$") catch empty
                  | {number: (.number | tonumber | tostring), text: .text}]
                  | reduce .[] as $line ({}; .[$line.number] += [$line.text])) as $lines
              | ($captured | file_lines | to_entries) as $expected
              | ($matching | length) > 0
                and (if ($expected | length) == 0 then
                  any($matching[]; (.content | returned_text) ==
                    "<system-reminder>Warning: the file exists but the contents are empty.</system-reminder>")
                else all($expected[]; . as $line
                  | ($lines[($line.key + 1 | tostring)] // [] | index($line.value)) != null) end);
            if type != "array" or length == 0 then "malformed_execution_file"
            else
              . as $m
              | [$m[] | select(.type == "result")] as $results
              | [$m[] | select(.type == "assistant")] as $turns
              | [$turns[] | blocks[] | select(.type == "tool_use")] as $uses
              | [$m[] | select(.type == "user") | blocks[] | select(.type == "tool_result")] as $responses
              | [$responses[] | .tool_use_id] as $answered
              | [$uses[] | select(.name == "Read") | . as $use
                  | $responses[] | select(.tool_use_id == $use.id
                      and (.is_error == null or .is_error == false))
                  | {path: $use.input.file_path, content: .content}] as $reads
              | [$m[] | select(.type == "system" and .subtype == "init")] as $init
              | if ($results | length) != 1 or $m[-1].type != "result"
                  or $m[-1].subtype != "success" or $m[-1].is_error != false then "no_clean_terminal_result"
                elif ($init | length) != 1 or ($init[0].tools | type) != "array"
                  or ($init[0].tools | index("Agent")) != null
                  or any($allowed[]; . as $tool | $init[0].tools | index($tool) | not) then "review_tools_not_as_configured"
                elif any($m[]; .type == "system"
                  and ((.subtype // "") | test("^task_|^background_tasks_changed$|^worker_shutting_down$"))) then "background_task_activity"
                elif any($m[]; (.type == "assistant" or .type == "user") and .parent_tool_use_id != null) then "subagent_activity"
                elif any($uses[]; .name as $name | $allowed | index($name) | not) then "unexpected_tool"
                elif any($uses[]; .id as $id | $answered | index($id) | not) then "unfinished_tool_use"
                elif ($turns | length) == 0
                  or ($turns[-1] | [blocks[] | select(.type == "tool_use")] | length) > 0 then "unfinished_tool_use"
                elif ($head | test("^[0-9a-f]{40}$") | not)
                  or any($uses[]; .name == "mcp__github_inline_comment__create_inline_comment"
                    and .input.commit_id != $head) then "wrong_inline_commit_identity"
                elif any($uses[]; select(.name == "mcp__github_inline_comment__create_inline_comment")
                  | .id as $id | any($responses[]; .tool_use_id == $id and .is_error == true)) then "errored_inline_tool_result"
                elif (covered($reads; $metadata; $metadata_content) | not)
                  or (covered($reads; $diff; $diff_content) | not) then "captured_inputs_not_read"
                else "verified" end
            end'
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            verdict false missing_execution_file
          elif [ ! -f "$REVIEW_METADATA_FILE" ] || [ ! -f "$REVIEW_DIFF_FILE" ]; then
            verdict false missing_captured_inputs
          elif ! python3 -c 'import pathlib,sys; [pathlib.Path(p).read_bytes().decode("utf-8") for p in sys.argv[1:]]' "$REVIEW_METADATA_FILE" "$REVIEW_DIFF_FILE" 2> /dev/null; then
            verdict false unsupported_captured_input_encoding
          elif ! reason=$(jq -r --arg head "$REVIEW_HEAD_SHA" --argjson allowed "$ALLOWED_TOOLS" --arg metadata "$REVIEW_METADATA_FILE" --arg diff "$REVIEW_DIFF_FILE" --rawfile metadata_content "$REVIEW_METADATA_FILE" --rawfile diff_content "$REVIEW_DIFF_FILE" "$program" "$EXECUTION_FILE" 2> /dev/null); then
            verdict false malformed_execution_file
          elif [ "$reason" = verified ]; then
            # Parse exact receipt integers with Python; jq numeric rounding must
            # not turn fractional or overflowing IDs into accepted evidence.
            if publication=$(python3 - "$EXECUTION_FILE" <<'PY_RECEIPTS'
          import json
          import sys

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("invalid_publication_receipt")
                  result[key] = value
              return result

          def content_blocks(message):
              content = message.get("message", {}).get("content", [])
              return content if isinstance(content, list) else []

          try:
              with open(sys.argv[1], encoding="utf-8") as source:
                  stream = json.load(source, object_pairs_hook=unique_object)
              uses = [block for message in stream if message.get("type") == "assistant"
                      for block in content_blocks(message) if block.get("type") == "tool_use"]
              responses = [block for message in stream if message.get("type") == "user"
                           for block in content_blocks(message) if block.get("type") == "tool_result"]
              use_ids = [use.get("id") for use in uses]
              if any(not isinstance(value, str) or not value.strip() for value in use_ids) or len(set(use_ids)) != len(use_ids):
                  raise ValueError("invalid_tool_use_identity")
              inline = [use for use in uses if use.get("name") == "mcp__github_inline_comment__create_inline_comment"]
              if len(inline) > 64:
                  raise ValueError("publication_receipt_limit_exceeded")
              ids = []
              for use in inline:
                  matching = [response for response in responses if response.get("tool_use_id") == use["id"]]
                  if len(matching) != 1:
                      raise ValueError("ambiguous_inline_tool_result")
                  response = matching[0]
                  if response.get("is_error") is not None and response.get("is_error") is not False:
                      raise ValueError("errored_inline_tool_result")
                  content = response.get("content")
                  if isinstance(content, list) and len(content) == 1 and isinstance(content[0], dict) and content[0].get("type") == "text":
                      content = content[0].get("text")
                  if not isinstance(content, str):
                      raise ValueError("invalid_publication_receipt")
                  receipt = json.loads(content, object_pairs_hook=unique_object)
                  if not isinstance(receipt, dict) or receipt.get("success") is not True or "error" in receipt or receipt.get("isError", False) is not False:
                      raise ValueError("invalid_publication_receipt")
                  if "buffered" in receipt and receipt["buffered"] is not False:
                      raise ValueError("unconfirmed_inline_publication")
                  comment_id = receipt.get("comment_id")
                  if type(comment_id) is not int or not 0 < comment_id <= 9007199254740991:
                      raise ValueError("invalid_publication_receipt")
                  ids.append(comment_id)
              if len(set(ids)) != len(ids):
                  raise ValueError("duplicate_publication_receipt")
              print(json.dumps({"attempt_count": len(inline), "comment_ids": ids}, separators=(",", ":")))
          except (ValueError, TypeError, KeyError, AttributeError, OSError) as error:
              reason = str(error)
              allowed = {"invalid_tool_use_identity", "publication_receipt_limit_exceeded", "ambiguous_inline_tool_result", "errored_inline_tool_result", "invalid_publication_receipt", "unconfirmed_inline_publication", "duplicate_publication_receipt"}
              print(reason if reason in allowed else "invalid_publication_receipt")
              sys.exit(1)
          PY_RECEIPTS
            ); then
              echo "finding_publication=$publication" >> "$GITHUB_OUTPUT"
              verdict true verified
            else
              verdict false "$publication"
            fi
          else
            verdict false "$reason"
          fi

  publish-status:
    name: Publish status
    needs: [start-check, review]
    # Runs after any review attempt start-check actually began, including a
    # failed one, but never for a comment start-check's gate skipped.
    if: always() && needs.start-check.result != 'skipped'
    runs-on: ubuntu-latest
    # Sized for the bundled review helper's bounded retries.
    timeout-minutes: 22
    # PR comments need pull-requests: write; top-level PR reactions use the issue endpoint and need issues: write.
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
    steps:
      - name: Check review tooling
        id: tooling-ready
        if: always()
        continue-on-error: true
        uses: $/actions/review-helper
        with:
          command: finalize
      - name: Download pre-review comment evidence
        # Present whenever start-check finished; a failed review is compared
        # too, so findings it posted before stopping are still recorded. A
        # failed download must not skip publication: the finalizer treats the
        # missing snapshot as incomplete evidence and fails closed.
        if: needs.start-check.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: claude-review-evidence
          path: ${{ runner.temp }}/claude-review-evidence
      - name: Publish Claude Review result
        # The review job's own result is the outer signal: a failure before
        # the action reports anything (checkout, inputs, startup) or during
        # publication or completion verification maps to failure, as does a
        # start-check failure after the check run was created.
        if: steps.tooling-ready.outcome == 'success'
        env:
          REVIEW_HELPER: ${{ steps.tooling-ready.outputs.helper-path }}
          PRESENTATION_OWNER: ${{ needs.start-check.outputs.presentation_owner }}
          GH_TOKEN: ${{ github.token }}
          RUNTIME_REPOSITORY: ${{ job.workflow_repository }}
          RUNTIME_SHA: ${{ job.workflow_sha }}
          RUNTIME_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.start-check.outputs.pr_number }}
          HEAD_SHA: ${{ needs.start-check.outputs.head_sha }}
          BASE_REF: ${{ needs.start-check.outputs.base_ref }}
          BASE_SHA: ${{ needs.start-check.outputs.base_sha }}
          MERGE_BASE_SHA: ${{ needs.start-check.outputs.merge_base_sha }}
          IS_FORK: ${{ needs.start-check.outputs.is_fork }}
          CHECK_RUN_ID: ${{ needs.start-check.outputs.check_run_id }}
          STATUS_COMMENTS_ENABLED: "true"
          PR_REACTION_MODE: manual
          MANUAL_COMPLETION_ENABLED: "true"
          START_RESULT: ${{ needs.start-check.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
          ACTION_CONCLUSION: ${{ needs.review.outputs.conclusion }}
          COMPLETION_VERIFIED: ${{ needs.review.outputs.completion_verified }}
          COMPLETION_REASON: ${{ needs.review.outputs.completion_reason }}
          FINDING_PUBLICATION: ${{ needs.review.outputs.finding_publication }}
          BEFORE_IDS_FILE: ${{ runner.temp }}/claude-review-evidence/before-comment-ids.json
          EXTERNAL_ID: ${{ github.workflow }}/${{ github.run_id }}/${{ github.run_attempt }}
          TRIGGER_LABEL: Manual request
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 "$REVIEW_HELPER" finalize
      - name: Record failure without review tooling
        # Reached when trusted helper tooling is unavailable, so a missing
        # helper alone cannot leave this run's check in_progress; if GitHub's
        # API stays unavailable, publishing may still fail and fail the job.
        # Uses only gh and jq from the runner image, with no checkout of its own.
        if: always() && steps.tooling-ready.outcome != 'success'
        timeout-minutes: 5
        env:
          PRESENTATION_OWNER: ${{ needs.start-check.outputs.presentation_owner }}
          GH_TOKEN: ${{ github.token }}
          RUNTIME_REPOSITORY: ${{ job.workflow_repository }}
          RUNTIME_SHA: ${{ job.workflow_sha }}
          RUNTIME_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.start-check.outputs.pr_number }}
          HEAD_SHA: ${{ needs.start-check.outputs.head_sha }}
          BASE_REF: ${{ needs.start-check.outputs.base_ref }}
          IS_FORK: ${{ needs.start-check.outputs.is_fork }}
          CHECK_RUN_ID: ${{ needs.start-check.outputs.check_run_id }}
          BASE_SHA: ${{ needs.start-check.outputs.base_sha }}
          MERGE_BASE_SHA: ${{ needs.start-check.outputs.merge_base_sha }}
          STATUS_COMMENT_ID: ${{ needs.start-check.outputs.status_comment_id }}
          EXTERNAL_ID: ${{ github.workflow }}/${{ github.run_id }}/${{ github.run_attempt }}
          TRIGGER_LABEL: Manual request
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          repair_review_presentation() {
            comment_timeout=10
            presentation_deadline=$((SECONDS + 120))
            presentation_api() {
              remaining=$((presentation_deadline - SECONDS))
              [ "$remaining" -gt 0 ] || return 1
              [ "$remaining" -gt "$comment_timeout" ] && remaining=$comment_timeout
              timeout "$remaining" gh api "$@"
            }
            [ -n "$PR_NUMBER" ] && [ -n "$STATUS_COMMENT_ID" ] && [ -n "$PRESENTATION_OWNER" ] || return 0
            owner_marker=$(python3 - <<'PY_OWNER'
          import hashlib, json, os
          from urllib.parse import quote
          try:
              owner = json.loads(os.environ["PRESENTATION_OWNER"])
              fields = {"version", "repo", "pr", "run", "attempt", "kind", "target", "head", "base", "base_ref", "started", "generation"}
              assert isinstance(owner, dict) and set(owner) == fields and owner["version"] == 1
              identity = {key: value for key, value in owner.items() if key != "generation"}
              assert owner["generation"] == hashlib.sha256(json.dumps(identity, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
              assert owner["kind"] in ("automatic", "issue_comment", "pull_request_review_comment")
              assert (owner["target"] is None if owner["kind"] == "automatic" else type(owner["target"]) is int and 0 < owner["target"] <= 9007199254740991)
              assert str(owner["run"]) == os.environ["GITHUB_RUN_ID"]
              assert str(owner["attempt"]) == os.environ["GITHUB_RUN_ATTEMPT"]
              assert owner["repo"] == os.environ["REPO"] and str(owner["pr"]) == os.environ["PR_NUMBER"]
              assert (owner["head"], owner["base"], owner["base_ref"]) == (os.environ["HEAD_SHA"], os.environ["BASE_SHA"], os.environ["BASE_REF"])
              print("<!-- claude-review-runtime:presentation-owner:" + quote(json.dumps(owner, sort_keys=True, separators=(",", ":")), safe="") + " -->")
          except (ValueError, KeyError, AssertionError):
              raise SystemExit(1)
          PY_OWNER
            ) || return 0
            verify_presentation_owner() {
              comment=$(presentation_api "repos/$REPO/issues/comments/$STATUS_COMMENT_ID" 2> /dev/null) &&
              printf '%s' "$comment" | jq -e --arg marker "$owner_marker" \
                '.user.login == "github-actions[bot]" and .user.type == "Bot" and (.body | contains("<!-- claude-review-runtime:claude-review-status -->")) and (.body | split("\n") | map(select(startswith("<!-- claude-review-runtime:presentation-owner:"))) == [$marker])' > /dev/null
            }
            verify_current_patch() {
              # Failure repair may clear progress after same-ref base movement,
              # but must preserve terminal historical presentation.
              running=$(printf '%s' "$comment" | jq -r '.body | contains("<!-- claude-review-runtime:presentation-owner-phase:running -->")')
              live_pr=$(presentation_api "repos/$REPO/pulls/$PR_NUMBER" 2> /dev/null) &&
              printf '%s' "$live_pr" | jq -e --arg head "$HEAD_SHA" --arg base "$BASE_REF" --arg sha "$BASE_SHA" --arg running "$running" \
                '.head.sha == $head and .base.ref == $base and (.base.sha == $sha or $running == "true")' > /dev/null
            }
            if ! verify_presentation_owner; then
              echo "::warning::Could not verify this attempt owns presentation; leaving it unchanged."
              return 0
            fi
            current_patch=true
            reaction_paths="repos/$REPO/issues/$PR_NUMBER/reactions"
            if ! verify_current_patch; then
              current_patch=false
              reaction_paths=
              # Preserve historical terminal reactions. Only a still-running
              # owned request can be cleaned after its patch is superseded.
              if ! printf '%s' "$comment" | jq -e '.body | contains("<!-- claude-review-runtime:presentation-owner-phase:running -->")' > /dev/null; then
                return 0
              fi
            fi
            # A trusted captured target, not model output, chooses the endpoint.
            kind=$(printf '%s' "$PRESENTATION_OWNER" | jq -r '.kind')
            target=$(printf '%s' "$PRESENTATION_OWNER" | jq -r '.target')
            namespace=
            case "$kind" in
              issue_comment) namespace=issues ;;
              pull_request_review_comment) namespace=pulls ;;
            esac
            if [ -n "$namespace" ] && printf '%s' "$target" | jq -e 'tonumber | . > 0 and . == floor' > /dev/null; then
              target_path="repos/$REPO/$namespace/comments/$target"
              parent=$namespace
              link=issue_url
              [ "$namespace" = pulls ] && link=pull_request_url
              if trigger=$(presentation_api "$target_path" 2> /dev/null) &&
                 printf '%s' "$trigger" | jq -e --arg id "$target" --arg link "$link" --arg url "https://api.github.com/repos/$REPO/$parent/$PR_NUMBER" \
                    '.id == ($id | tonumber) and .[$link] == $url' > /dev/null; then
                reaction_paths="$reaction_paths $target_path/reactions"
              else
                echo "::warning::Could not verify the captured trigger comment."
              fi
            fi
            for reaction_path in $reaction_paths; do
              if reactions=$(presentation_api --paginate "$reaction_path?per_page=100" 2> /dev/null) &&
                 ids=$(printf '%s' "$reactions" | jq -rs '.[].[] | select(.user.login == "github-actions[bot]" and (.content == "eyes" or .content == "+1")) | .id'); then
                for reaction_id in $ids; do
                  verify_presentation_owner || return 0
                  if [ "$reaction_path" = "repos/$REPO/issues/$PR_NUMBER/reactions" ]; then
                    verify_current_patch || return 0
                  fi
                  if ! presentation_api --method DELETE "$reaction_path/$reaction_id" > /dev/null; then
                    echo "::warning::Could not clear a workflow-owned Claude Review reaction."
                  fi
                done
              else
                echo "::warning::Could not inspect workflow-owned Claude Review reactions."
              fi
            done
            [ "$current_patch" = true ] || return 0
            verify_presentation_owner && verify_current_patch || return 0
            if [ "$1" = failure ]; then
              state=failure
              message='This review did not complete reliably; this commit is not approved by it.'
            elif [ "$IS_FORK" = true ] && [ -z "$CHECK_RUN_ID" ]; then
              state=publication_incomplete
              message='Review completion cannot be established because authoritative Check publication is unavailable. Consult the workflow run and inline review threads.'
            else
              state=publication_incomplete
              message='The authoritative Check result could not be published. Treat this commit as not reviewed.'
            fi
            encoded_base=$(jq -nr --arg ref "$BASE_REF" '$ref | @uri')
            reviewed_markers=$(printf '%s' "$comment" | jq -r '.body | split("\n") | map(select(startswith("<!-- claude-review-runtime:claude-review-last-reviewed-"))) | join("\n")')
            if [ -z "$reviewed_markers" ]; then
              old_body=$(printf '%s' "$comment" | jq -r '.body')
              old_result=
              case "$old_body" in
                *'Claude Review completed with no findings for this commit.'*) old_result=success ;;
                *'Claude Review recorded findings for this commit.'*) old_result=action_required ;;
              esac
              if [ -n "$old_result" ]; then
                old_head=$(printf '%s' "$comment" | jq -r '.body | try capture("<!-- claude-review-runtime:claude-review-status-head:(?<value>[0-9a-f]{40}) -->").value catch ""')
                old_base=$(printf '%s' "$comment" | jq -r '.body | try capture("<!-- claude-review-runtime:claude-review-status-base-ref:(?<value>[A-Za-z0-9_.~%-]+) -->").value catch ""')
                if [ -n "$old_head" ] && [ -n "$old_base" ]; then
                  reviewed_markers=$(printf '<!-- claude-review-runtime:claude-review-last-reviewed-head:%s -->\n<!-- claude-review-runtime:claude-review-last-reviewed-base-ref:%s -->\n<!-- claude-review-runtime:claude-review-last-reviewed-result:%s -->' "$old_head" "$old_base" "$old_result")
                fi
              fi
            fi
            if [ -n "$reviewed_markers" ]; then
              reviewed_markers="$reviewed_markers"$'\n'
            fi
            trigger_line=
            if [ -n "$TRIGGER_LABEL" ]; then
              trigger_line=$'\n'"**Trigger:** $TRIGGER_LABEL"
            fi
            reviewed_markers="$owner_marker"$'\n''<!-- claude-review-runtime:presentation-owner-phase:terminal -->'$'\n'"$reviewed_markers"
            rendered=$(printf '<!-- claude-review-runtime:claude-review-status -->\n<!-- claude-review-runtime:claude-review-status-head:%s -->\n<!-- claude-review-runtime:claude-review-status-base-ref:%s -->\n<!-- claude-review-runtime:claude-review-status-state:%s -->\n%s### ❌ Claude Review incomplete\n\n**Current commit:** `%s`%s\n\n%s\n\n[Workflow run](%s)' \
              "$HEAD_SHA" "$encoded_base" "$state" "$reviewed_markers" "${HEAD_SHA:0:7}" "$trigger_line" "$message" "$DETAILS_URL")
            body=$(jq -n --arg body "$rendered" '{body: $body}')
            verify_presentation_owner && verify_current_patch || return 0
            if ! printf '%s' "$body" | presentation_api --method PATCH "repos/$REPO/issues/comments/$STATUS_COMMENT_ID" --input - > /dev/null; then
              echo "::warning::Could not repair the known Claude Review status comment."
            fi
          }
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Review tooling was unavailable and the reviewed head SHA was never resolved, so no exact-SHA Claude Review check run can record this failure."
            exit 1
          fi
          delay=${CLAUDE_REVIEW_RETRY_DELAY:-2}
          # Each gh call is bounded, since gh api has no timeout of its own:
          # two phases of three attempts stay well inside this step's timeout.
          attempt_timeout=${CLAUDE_REVIEW_GH_TIMEOUT:-20}
          # start-check may have created the run without reporting it. Find it
          # by this run's external_id before creating anything, and never POST
          # while that lookup is unresolved, so no duplicate is created while
          # its existence is unknown. If the lookup never succeeds, such a run
          # may remain in_progress and the job fails instead.
          if [ -z "$CHECK_RUN_ID" ] && [ -n "$EXTERNAL_ID" ]; then
            reconciled=false
            for attempt in 1 2 3; do
              if history=$(timeout "$attempt_timeout" gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=Claude%20Review&filter=all&per_page=100"); then
                CHECK_RUN_ID=$(printf '%s' "$history" | jq -rs --arg ext "$EXTERNAL_ID" \
                  '[.[].check_runs[]? | select(.external_id == $ext) | .id] | first // empty')
                reconciled=true
                break
              fi
              [ "$attempt" -lt 3 ] && sleep "$((attempt * delay))"
            done
            if [ "$reconciled" != true ]; then
              echo "::error::Could not confirm whether this run already created a Claude Review check run, so none was created or completed."
              repair_review_presentation publication_incomplete
              exit 1
            fi
          fi
          if [ -z "$CHECK_RUN_ID" ] && [ "$IS_FORK" = "true" ]; then
            echo "::error::Review tooling was unavailable and this fork PR has no Claude Review check run to complete."
            repair_review_presentation publication_incomplete
            exit 1
          fi
          summary=$(printf '**Reviewed commit:** `%s`\n\nThe review outcome could not be published because the review tooling was unavailable; treat this commit as not reviewed.\n\n[Workflow run](%s)' "$HEAD_SHA" "$DETAILS_URL")
          evidence=$(jq -n --arg head "$HEAD_SHA" --arg pr "$PR_NUMBER" --arg base "$BASE_SHA" --arg merge_base "$MERGE_BASE_SHA" \
            --arg runtime_repository "$RUNTIME_REPOSITORY" --arg runtime_sha "$RUNTIME_SHA" --arg runtime_workflow_path "$RUNTIME_WORKFLOW_PATH" \
            '{reviewed_sha: $head, pr_number: ($pr | tonumber? // null), base_sha: $base, merge_base_sha: $merge_base, runtime_repository: $runtime_repository, runtime_sha: $runtime_sha, runtime_workflow_path: $runtime_workflow_path}')
          output=$(jq -n --arg summary "$summary" --arg evidence "$evidence" \
            '{title: "Review outcome could not be published", summary: $summary, text: ("```json\n" + $evidence + "\n```")}')
          if [ -n "$CHECK_RUN_ID" ]; then
            method=PATCH
            path="repos/$REPO/check-runs/$CHECK_RUN_ID"
            body=$(jq -n --argjson output "$output" '{status: "completed", conclusion: "failure", output: $output}')
          else
            method=POST
            path="repos/$REPO/check-runs"
            body=$(jq -n --argjson output "$output" --arg sha "$HEAD_SHA" --arg ext "$EXTERNAL_ID" \
              '{name: "Claude Review", head_sha: $sha, external_id: $ext, status: "completed", conclusion: "failure", output: $output}')
          fi
          for attempt in 1 2 3; do
            if printf '%s' "$body" | timeout "$attempt_timeout" gh api --method "$method" "$path" --input - > /dev/null; then
              echo "::error::Review tooling was unavailable; recorded failure on the Claude Review check run."
              repair_review_presentation failure
              exit 1
            fi
            [ "$attempt" -lt 3 ] && sleep "$((attempt * delay))"
          done
          echo "::error::Could not complete the Claude Review check run; it may remain in progress."
          repair_review_presentation publication_incomplete
          exit 1
