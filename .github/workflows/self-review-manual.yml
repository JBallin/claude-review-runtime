name: Manual Claude self-review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  eligibility:
    if: >-
      contains(fromJSON('["/claude-review","/claude-review opus","/claude-review sonnet","/claude-review haiku","/claude-review low","/claude-review medium","/claude-review high","/claude-review xhigh","/claude-review max","/claude-review opus low","/claude-review sonnet low","/claude-review haiku low","/claude-review opus medium","/claude-review sonnet medium","/claude-review haiku medium","/claude-review opus high","/claude-review sonnet high","/claude-review haiku high","/claude-review opus xhigh","/claude-review sonnet xhigh","/claude-review haiku xhigh","/claude-review opus max","/claude-review sonnet max","/claude-review haiku max"]'), github.event.comment.body) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    steps:
      - name: Check PR eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          eligible=$(printf '%s' "$pr" | jq -r --arg repo "$REPO" '
            .state == "open" and .draft == false and .head.repo.full_name == $repo')
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

  review:
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
      id-token: write
    uses: JBallin/claude-review-runtime/.github/workflows/claude.yml@396f9f74195fe7df2b3081dca3d1550f2fb2e574
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
