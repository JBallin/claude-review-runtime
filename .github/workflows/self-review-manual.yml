name: Manual Claude self-review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  eligibility:
    # Forward candidate text; the pinned Runtime owns command parsing and admission.
    if: >-
      contains(github.event.comment.body, '/claude-review') &&
      github.event.comment.user.type == 'User' &&
      github.event.sender.type == 'User' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    steps:
      - name: Check PR eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          eligible=$(printf '%s' "$pr" | jq -r --arg repo "$REPO" '
            .state == "open" and .draft == false and .head.repo.full_name == $repo')
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

  review:
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
      id-token: write
    uses: JBallin/claude-review-runtime/.github/workflows/claude.yml@aa8a979d537c2fd7de1694cb480af26c8902b411
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
